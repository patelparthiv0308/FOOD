<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Order Success | Royal Bite</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;600&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(rgba(0, 0, 0, 0.8), rgba(0, 0, 0, 0.8)), 
                  url('https://images.unsplash.com/photo-1513104890138-7c749659a591?w=1600&h=900&fit=crop') no-repeat center center fixed;
      background-size: cover;
      color: #fff;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .success-card {
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 30px;
      padding: 50px;
      text-align: center;
      max-width: 600px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.5);
    }
    .check-icon {
      font-size: 80px;
      color: #28a745;
      margin-bottom: 20px;
      animation: scaleUp 0.5s ease-out;
    }
    @keyframes scaleUp {
      from { transform: scale(0); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }
    .btn-home {
      background: #ffc107;
      color: #000;
      font-weight: 700;
      padding: 12px 30px;
      border-radius: 30px;
      text-decoration: none;
      transition: 0.3s;
      display: inline-block;
      margin-top: 30px;
    }
    .btn-home:hover {
      background: #e5ac00;
      transform: translateY(-3px);
    }
  </style>
</head>
<body>

<div class="success-card shadow-lg">
  <div class="check-icon">✅</div>
  <h1 class="display-4 fw-bold text-warning mb-3">Order Successful!</h1>
  <p class="lead mb-4">Thank you for choosing <strong>Royal Bite</strong>. Your delicious meal is being prepared with royal care and will reach you shortly.</p>
  <div class="border-top border-secondary pt-4 mt-4">
    <p class="small text-light opacity-75">A confirmation email has been sent to your address.</p>
    <a href="index.html" class="btn-home">Back to Home</a>
  </div>
</div>

<script>
  // Clear cart after successful order
  localStorage.removeItem("cart");
</script>

</body>
</html>
